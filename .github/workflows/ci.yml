name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      # The package declares Swift 5 mode, so a consumer on Swift 6 still compiles
      # these sources as v5 and would never see a diagnostic from them. That is
      # exactly why it has to be checked here: a library that only compiles cleanly
      # in the mode it happens to declare is one toolchain bump from being someone
      # else's problem.
      - name: Swift 6 language mode, sources and tests
        run: swift build --build-tests -Xswiftc -swift-version -Xswiftc 6

  ios:
    name: Build and test (iOS)
    runs-on: macos-14
    # LoupeUI's UIKit paths never compile on macOS, so the macOS job cannot catch a
    # break in them - and until this job ran tests rather than only a build, the
    # UIKit half of the picker had no coverage at all.
    steps:
      - uses: actions/checkout@v5

      # Named dynamically: `test` needs a concrete simulator, unlike `build`, and
      # hard-coding a model is what broke this job the last time Xcode dropped one.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE '^ +iPhone [^(]+' | head -1 | xargs)
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test on the iOS Simulator
        # pipefail matters here: without it the pipeline reports xcpretty's exit
        # code, so a failed build is reported as a passing job.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Loupe-Package \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  catalyst:
    name: Build (Mac Catalyst)
    runs-on: macos-14
    # Catalyst can import AppKit but cannot use it, so a standalone
    # `#if canImport(AppKit)` block compiles alongside the UIKit one and then fails
    # on NSPanel. Neither the macOS job nor the iOS job catches that; only this does.
    steps:
      - uses: actions/checkout@v5

      - name: Build for Mac Catalyst
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LoupeUI \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  web:
    name: Build and test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # Also fails if docs/tokens.json and the generated copy have drifted: a token
      # that means two things on two platforms is worse than no token at all.
      - name: Test
        run: npm test

      - name: The generated tokens are committed and current
        run: git diff --exit-code src/tokens.generated.ts
