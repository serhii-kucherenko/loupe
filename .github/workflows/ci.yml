name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  ios:
    name: Build and test (iOS)
    runs-on: macos-14
    # LoupeUI's UIKit paths never compile on macOS, so the macOS job cannot catch a
    # break in them - and until this job ran tests rather than only a build, the
    # UIKit half of the picker had no coverage at all.
    steps:
      - uses: actions/checkout@v5

      # Named dynamically: `test` needs a concrete simulator, unlike `build`, and
      # hard-coding a model is what broke this job the last time Xcode dropped one.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE '^ +iPhone [^(]+' | head -1 | xargs)
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test on the iOS Simulator
        # pipefail matters here: without it the pipeline reports xcpretty's exit
        # code, so a failed build is reported as a passing job.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Loupe-Package \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  swift6:
    name: Swift 6 language mode
    # A newer image on purpose. macos-14 ships a toolchain that rejects
    # `-swift-version 6` outright, and the job above stays on it deliberately: the
    # README promises Swift 5.9, and something has to keep proving that.
    #
    # This matters even though the package declares Swift 5 mode. A consumer on
    # Swift 6 compiles these sources as v5 and would never see a diagnostic from
    # them - which is exactly why nothing else would catch it. A library that only
    # compiles cleanly in the mode it happens to declare is one toolchain bump from
    # being somebody else's problem.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Sources and tests, in Swift 6 mode
        run: swift build --build-tests -Xswiftc -swift-version -Xswiftc 6

  catalyst:
    name: Build (Mac Catalyst)
    runs-on: macos-14
    # Catalyst can import AppKit but cannot use it, so a standalone
    # `#if canImport(AppKit)` block compiles alongside the UIKit one and then fails
    # on NSPanel. Neither the macOS job nor the iOS job catches that; only this does.
    steps:
      - uses: actions/checkout@v5

      - name: Build for Mac Catalyst
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LoupeUI \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  ipad:
    name: Build the demo app, and touch it (iPad and iPhone)
    # Not macos-14 like the other Apple jobs. XcodeGen writes the newest project
    # format it knows and offers no way to pin an older one, so the generated
    # project cannot be opened by the Xcode on that image at all
    # ("future Xcode project file format (77)").
    runs-on: macos-15
    # The demo's iOS half - the app delegate, the scene hook, the window attach - is
    # not in any SwiftPM target, so the iOS job above never compiles it. Every
    # device bug found so far came out of running this app, so it has to keep
    # building.
    steps:
      - uses: actions/checkout@v5

      # Whatever the newest Xcode on the image is, for the same reason.
      - name: Use the newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: Examples/LoupeDemoApp
        run: xcodegen generate

      # A generic destination, because this job only builds. Naming a device meant
      # parsing `simctl list`, and the model suffix is part of the name rather than
      # the UDID - "iPad Pro 11-inch (M4)" was cut to "iPad Pro 11-inch", which
      # matches nothing.
      - name: Build for the iOS Simulator
        working-directory: Examples/LoupeDemoApp
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project LoupeDemo.xcodeproj \
            -scheme LoupeDemo \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      # The only tests that touch the overlay with a finger.
      #
      # Everything else drives the model, which proves the model and nothing else -
      # and the overlay's own controls were once completely untappable on iOS with a
      # fully green suite, because a `UIHostingController` is one `UIView` and "does
      # the touch arrive" is a question no unit test can ask. The drawer's pull then
      # failed the same way: the drag worked about half the time, because a `Button`
      # tap recogniser was winning a race it should lose.
      #
      # A concrete device, unlike the build above, because a test has to run
      # somewhere. Matching the UDID rather than the name: the model suffix is part
      # of the name, so "iPad Pro 11-inch (M4)" gets cut at the bracket and matches
      # nothing.
      - name: Touch the overlay on an iPad
        working-directory: Examples/LoupeDemoApp
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 'iPad' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          test -n "$DEVICE" || { echo "no iPad simulator on this image"; exit 1; }
          echo "using $DEVICE"
          xcodebuild test-without-building \
            -project LoupeDemo.xcodeproj \
            -scheme LoupeDemo \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  # Nothing to build, so they answer in seconds and on a Linux runner.
  lint:
    name: Nothing quiet, nothing hardcoded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Six bugs in one evening shared one shape: something that could fail, a
      # result nobody was forced to read, and a product that carried on looking
      # fine. One of them left sign-in *working* while quietly turning the PKCE
      # verifier into a constant - a failure with no symptom, which using the
      # product can never find. A sweep finds today's six; this catches the
      # seventh.
      - run: python3 scripts/check-quiet-failures.py
      # A host app can hand Loupe its own tokens, and that promise is only as
      # good as the weakest call site. One hardcoded orange and the overlay is a
      # visitor again in exactly one control - which reads as a bug rather than
      # as a theme, and only shows up inside the host nobody testing Loupe runs.
      - run: python3 scripts/check-theme-literals.py

  web:
    name: Build and test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # Also fails if docs/tokens.json and the generated copy have drifted: a token
      # that means two things on two platforms is worse than no token at all.
      - name: Test
        run: npm test

      - name: The generated tokens are committed and current
        run: git diff --exit-code src/tokens.generated.ts
