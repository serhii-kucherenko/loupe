name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  ios:
    name: Build (iOS)
    runs-on: macos-14
    # LoupeUI's UIKit paths never compile on macOS, so the macOS job cannot
    # catch a break in them. This job is the only thing that does.
    steps:
      - uses: actions/checkout@v5

      - name: Build for iOS Simulator
        # pipefail matters here: without it the pipeline reports xcpretty's exit
        # code, so a failed build is reported as a passing job.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LoupeUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  web:
    name: Build and test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # Also fails if docs/tokens.json and the generated copy have drifted: a token
      # that means two things on two platforms is worse than no token at all.
      - name: Test
        run: npm test

      - name: The generated tokens are committed and current
        run: git diff --exit-code src/tokens.generated.ts
