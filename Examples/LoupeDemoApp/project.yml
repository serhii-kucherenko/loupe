# The iPad and iPhone build of the demo.
#
# SwiftPM cannot produce an iOS .app, so this needs an Xcode project. Only the
# generator input is committed: a generated .xcodeproj alongside a project.yml would
# be two truths, and the one nobody edits is the one that rots.
#
#   brew install xcodegen && xcodegen generate
#
# The sources are the *same files* the macOS demo builds. There is one copy of the
# demo, and two build systems pointing at it.
name: LoupeDemo
options:
  bundleIdPrefix: dev.loupe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

packages:
  Loupe:
    path: ../..

targets:
  LoupeDemo:
    type: application
    platform: iOS
    sources:
      - path: ../LoupeDemo/Sources/LoupeDemo
    dependencies:
      - package: Loupe
        product: LoupeCore
      - package: Loupe
        product: LoupeUI
      - package: Loupe
        product: LoupeLinear
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loupe.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # The demo is never signed and never leaves a simulator or a dev device.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.9"

  # A gesture is the one thing that cannot be checked any other way. A unit test can
  # prove the model moves when told to; only a real touch proves the touch reaches it.
  # The overlay's own controls were completely untappable on iOS once (SER-682) and
  # every test passed the whole time, because they all drove the model directly.
  LoupeDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LoupeDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loupe.demo.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: LoupeDemo

schemes:
  LoupeDemo:
    build:
      targets:
        LoupeDemo: all
        LoupeDemoUITests: [test]
    test:
      targets:
        - LoupeDemoUITests
